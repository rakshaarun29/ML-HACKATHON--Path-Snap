name: HMM CI

on:
  push:
    branches: [ main, hmm-baseline ]
    paths:
      - 'hmm Model/src/baseline_hmm.py'
      - 'hmm Model/src/test_hmm.py'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'hmm Model/src/baseline_hmm.py'
      - 'hmm Model/src/test_hmm.py'
      - '.github/workflows/ci.yml'

jobs:
  test-hmm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install HMM dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy

      - name: Syntax check (HMM)
        run: |
          python -m py_compile "hmm Model/src/baseline_hmm.py" "hmm Model/src/test_hmm.py"

      - name: Run HMM unit tests
        env:
          PYTHONPATH: "hmm Model/src"
        run: |
          python -m unittest discover -s "hmm Model/src" -p "test_*.py" -v
