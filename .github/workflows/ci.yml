name: CI

on:
  push:
    branches: [ main, hmm-baseline ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn

      - name: Syntax check
        run: |
          python -m py_compile baseline_hmm.py sklearn_hmm.py grid_search_cv.py test_hmm.py

      - name: Run unit tests
        run: |
          python -m unittest test_hmm.py -v
