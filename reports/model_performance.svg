<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">Reported model performance by metric</title>
  <desc id="desc">Three separate comparisons. GPS point match rate: KNN 63.85 percent, MLP 78.81 percent. Top-one arc accuracy: logistic regression 79.04 percent, random forest 80.35 percent. Route length F1: HMM 98.84 percent, HMM with smoothing 99.35 percent, HGBC with Viterbi 97.07 percent. Different groups use different metrics and evaluation sets.</desc>
